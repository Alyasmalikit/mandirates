name: Daily mandi prices
on:
 schedule: [{cron: '0 7,17 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build.py
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      - run: |
          git config user.name "mandirates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
